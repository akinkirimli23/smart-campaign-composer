server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths fall back to index.html. The page itself
    # must be revalidated on every visit, or a browser keeps showing the
    # previous release after a deploy.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Bundles carry a content hash in their name, so they can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Same origin for the browser, so no CORS. Two endpoints under /api are
    # server-sent event streams (content generation, live campaign status):
    # buffering must be off or events arrive in one lump at the end, and the
    # read timeout must outlast a quiet stream.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
