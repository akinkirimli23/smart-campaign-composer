server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same origin for the browser, so no CORS. Two endpoints under /api are
    # server-sent event streams (content generation, live campaign status):
    # buffering must be off or events arrive in one lump at the end, and the
    # read timeout must outlast a quiet stream.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
