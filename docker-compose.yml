name: smart-campaign-composer

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scc
      POSTGRES_PASSWORD: scc
      POSTGRES_DB: scc
    ports:
      - "5433:5432"   # host 5433 to avoid clashing with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scc -d scc"]
      interval: 2s
      timeout: 3s
      retries: 30
    # Like the services that depend on it: without this, after a Docker or
    # machine restart the API comes back but the database does not.
    restart: unless-stopped

  # One-shot: applies migrations and loads the fake users (skipped if present).
  init:
    build: ./backend
    command: ["seed"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://scc:scc@postgres:5432/scc?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Fake SMS / email provider: accepts messages, sometimes fails, is slow or
  # answers 429. Nothing leaves this container.
  mock-provider:
    build: ./backend
    command: ["mockprovider"]
    env_file:
      - path: .env
        required: false
    environment:
      HTTP_ADDR: ":8090"
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    command: ["api"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://scc:scc@postgres:5432/scc?sslmode=disable
      HTTP_ADDR: ":8080"
      PROVIDER_URL: http://mock-provider:8090
    ports:
      - "8080:8080"
    depends_on:
      init:
        condition: service_completed_successfully
      mock-provider:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/readyz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # The Vue app. nginx serves the bundle and proxies /api to the api service,
  # so the browser talks to a single origin.
  web:
    build:
      context: ./frontend
      target: runtime
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Frontend unit tests (vitest); part of `make test`.
  web-test:
    profiles: ["test"]
    build:
      context: ./frontend
      target: test

  # Only started by `make test` (profile "test"); never part of `docker compose up`.
  test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      TEST_DATABASE_URL: postgres://scc:scc@postgres-test:5432/scc_test?sslmode=disable
    depends_on:
      postgres-test:
        condition: service_healthy

  postgres-test:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scc
      POSTGRES_PASSWORD: scc
      POSTGRES_DB: scc_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scc -d scc_test"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
